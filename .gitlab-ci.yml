include:
  - project: "gary.schaetz/private/pipelines"
    ref: main
    file: 'templates/rules/rules.yml'

stages:
  - test
  - build
  - deploy

variables:
  UV_NO_SYNC: "0"

test:
  image: gschaetz/python:latest
  stage: test
  tags:
    - docker
    - kubernetes
  # Explicit rules instead of relying on GitLab's implicit default (only: [branches, tags]):
  # that default happens to exclude merge_request_event already, but making it explicit here
  # matches the pattern every other repo running on these self-hosted runners uses, rather
  # than depending on undocumented default behavior for a job that runs arbitrary repo code.
  rules:
    - !reference [.job_rules, standard-rule]
    - !reference [.job_rules, manual-rule]
    - !reference [.job_rules, schedule-rule]
  script:
    - uv sync
    - uv run pytest

build:
  image: gschaetz/python:latest
  stage: build
  tags:
    - docker
    - kubernetes
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - uv build
  artifacts:
    paths:
      - dist/

deploy:
  image: gschaetz/python:latest
  stage: deploy
  tags:
    - docker
    - kubernetes
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  dependencies:
    - build
  script:
    - uv publish --token $PYPI_API_TOKEN
