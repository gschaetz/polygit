stages:
  - test
  - build
  - deploy

variables:
  UV_NO_SYNC: "0"

test:
  image: gschaetz/python:latest
  stage: test
  tags:
    - docker
    - kubernetes
  script:
    - uv sync
    - uv run pytest

build:
  image: gschaetz/python:latest
  stage: build
  tags:
    - docker
    - kubernetes
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - uv build
  artifacts:
    paths:
      - dist/

deploy:
  image: gschaetz/python:latest
  stage: deploy
  tags:
    - docker
    - kubernetes
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  dependencies:
    - build
  script:
    - uv publish --token $PYPI_API_TOKEN
